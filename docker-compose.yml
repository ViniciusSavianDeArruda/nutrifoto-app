# Ambiente local completo: Postgres + migrações + API (wrangler dev) + front (Vite).
# Subir:   npm run docker:up        (ou: docker compose up --build -V)
# As variáveis daqui vêm do .env da raiz; as da API, de apps/worker/.dev.vars.
name: nutrifoto

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env (copie de .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (copie de .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env (copie de .env.example)}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [nutrifoto]

  migrate:
    build: ./apps/worker
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./apps/worker/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [nutrifoto]

  worker:
    build: ./apps/worker
    restart: unless-stopped
    environment:
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # Usada só pelos scripts dentro do container (ex.: docker compose exec worker npm run invite).
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/worker:/app
      - /app/node_modules
      - worker_wrangler:/app/.wrangler
    ports:
      - "127.0.0.1:${WORKER_PORT:-8787}:8787"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    networks: [nutrifoto]

  web:
    build:
      context: ./apps/web
      target: dev
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://worker:8787
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      worker:
        condition: service_healthy
    networks: [nutrifoto]

  # Build de produção do front (nginx). Só sobe com: docker compose --profile prod up --build web-prod
  web-prod:
    profiles: ["prod"]
    build:
      context: ./apps/web
      target: prod
      args:
        VITE_API_URL: ""
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PROD_PORT:-8080}:8080"
    depends_on:
      worker:
        condition: service_healthy
    networks: [nutrifoto]

volumes:
  db_data:
  worker_wrangler:

networks:
  nutrifoto:
